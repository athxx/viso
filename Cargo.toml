[workspace]
resolver = "2"
members = [
    "crates/viso",
    "crates/macros",
    "crates/math",
    "crates/ende",
    "crates/runtime",
    "crates/platform",
    "crates/handle",
    "crates/gpu",
    "crates/shader",
    "crates/text",
    "crates/render",
    "crates/ui",
    "crates/ui-macros",
    "crates/widgets",
    "crates/dsl",
    "crates/lsp",
    "crates/services",
    "xtask",
    "libs/woff2",
    "examples/hello_world",
    "examples/01-counter",
]

# viso-ext/ is a user-maintained plugin library and is intentionally NOT a
# workspace member — Phase 0 ignores it.

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/visoui/viso"

# ---------------------------------------------------------------------------
# Internal crates. Every dependency edge declared here is checked against the
# architecture DAG (Viso_Architecture.md, architecture 10) by `cargo xtask
# check-deps`. Do not add an edge without updating that check.
# ---------------------------------------------------------------------------
[workspace.dependencies]
viso = { path = "crates/viso", version = "0.0.0" }
viso-macros = { path = "crates/macros", version = "0.0.0" }
viso-math = { path = "crates/math", version = "0.0.0" }
viso-ende = { path = "crates/ende", version = "0.0.0" }
viso-runtime = { path = "crates/runtime", version = "0.0.0" }
viso-platform = { path = "crates/platform", version = "0.0.0" }
viso-handle = { path = "crates/handle", version = "0.0.0" }
viso-gpu = { path = "crates/gpu", version = "0.0.0" }
viso-shader = { path = "crates/shader", version = "0.0.0" }
viso-text = { path = "crates/text", version = "0.0.0" }
viso-render = { path = "crates/render", version = "0.0.0" }
viso-ui = { path = "crates/ui", version = "0.0.0" }
viso-ui-macros = { path = "crates/ui-macros", version = "0.0.0" }
viso-widgets = { path = "crates/widgets", version = "0.0.0" }
viso-dsl = { path = "crates/dsl", version = "0.0.0" }
viso-lsp = { path = "crates/lsp", version = "0.0.0" }
viso-services = { path = "crates/services", version = "0.0.0" }

# ---------------------------------------------------------------------------
# Third-party crates. These are not viso* edges, so `cargo xtask check-deps`
# ignores them. The text subsystem uses the same standard-parse/shape/raster
# crates makepad relies on (font parsing, HarfBuzz-port shaping, coverage
# rasterization, coverage→SDF), and reimplements only layout orchestration and
# atlas packing natively.
# ---------------------------------------------------------------------------
ttf-parser = "0.24"
rustybuzz = "0.18"
ab_glyph_rasterizer = "0.1"
sdfer = "0.2"
unicode-bidi = "0.3"
unicode-script = "0.5"
# UAX#29 grapheme/word segmentation for width-aware line breaking: word
# boundaries give the primary break opportunities, graphemes the fallback when a
# single word overflows. Same source the reference layouter uses for wrapping.
unicode-segmentation = "1"
# UAX#14 line breaking (architecture 3.7 prefer-proven-algorithms). ICU4X is the
# world-ready provider: pair-table base plus locale tailoring, CSS strictness
# (Loose/Normal/Strict/Anywhere), and — the reason we take the heavier dep over a
# pure pair-table crate — dictionary/LSTM segmentation for the no-space scripts
# (Thai/Lao/Khmer/CJK) that a pair table cannot break at all. `line_break.rs`
# wraps `LineSegmenter`; `icu_properties` classifies each break opportunity as
# mandatory (hard newline) or allowed via the `LineBreak` code-point property.
# icu_segmenter 2.3 targets UAX#14 Unicode 15.1.0 — the conformance corpus is
# version-matched to that.
icu_segmenter = "2.3"
icu_properties = "2.3"
# Pure-Rust PNG decoder for color-bitmap emoji strikes (sbix/CBDT PNG data that
# ttf-parser hands back as raw bytes). Same decoder family makepad's color-emoji
# path uses; decoded RGBA is premultiplied into the color glyph atlas.
zune-png = "0.5"
zune-core = "0.5"
# WOFF2 web fonts embed their sfnt tables as one brotli stream (WOFF2 §4).
# `viso-woff2` (libs/woff2) decompresses them to sfnt; the core facade never
# touches WOFF2 (it only accepts sfnt), so this is only depended on by that
# standalone library. Pure-Rust, builds for wasm32; `std` gives the reader that
# wraps std::io::Read.
brotli-decompressor = { version = "5.0", default-features = false, features = ["std"] }

# Standalone WOFF2 → sfnt decompression library (libs/woff2, vendored, §3.7
# prefer-proven-algorithms). NOT a core dependency: a developer with WOFF2 bytes
# calls `viso_woff2::decompress` themselves, then passes the resulting sfnt to
# `AppCx::load_font`. Kept a workspace member so it builds/tests/releases here.
viso-woff2 = { path = "libs/woff2", version = "1.0.0" }

# macOS system-font resolution. The facade binds CoreText through the objc2
# family (same generation as viso-platform's objc2 0.6 stack), asking the OS for
# a face that covers a sample string and reassembling its sfnt tables for
# ttf-parser/rustybuzz. Only linked on macOS via a target-gated dependency.
objc2-core-text = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
