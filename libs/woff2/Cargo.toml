[package]
name = "viso-woff2"
version = "1.0.0"
authors = ["Athan <info@viso.im>"]
edition = "2024"
description = "Minimal WOFF2 to sfnt font decompressor for VISO"
license = "LGPL-3.0"
homepage = "https://viso.im"
repository = "https://github.com/visoui/viso/"

[dependencies]
# woff2 fonts embed their font tables as a single brotli stream (WOFF2 spec §4).
# Pure-Rust decompressor — builds for wasm32-unknown-unknown. The `std` feature
# gives the `Decompressor` reader (wraps std::io::Read).
brotli-decompressor = { workspace = true }

[dev-dependencies]
# The decode test shapes the reconstructed sfnt through the same shaper the text
# engine uses, proving the glyf/loca transform round-trips to real glyphs.
rustybuzz = { workspace = true }
