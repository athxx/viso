[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Build/CI automation. `cargo xtask check-deps` enforces the architecture DAG
# (section 10) so a forbidden dependency edge fails CI rather than review.
[dependencies]
# `cargo xtask bundle` packages a release build with the packager `viso run`
# packages each dev build with.
viso-package = { workspace = true }
# `cargo xtask footprint` reads the frame samples and the window detail a
# headless run writes, and keeps its baseline as JSON.
viso-dev-protocol = { workspace = true }
viso-ende = { workspace = true }
