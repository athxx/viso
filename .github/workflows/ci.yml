name: viso-ci

on:
  push:
  pull_request:

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The text tests resolve CJK, Devanagari and color emoji through fontconfig.
      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      # Phase 0 exit criterion: dependency direction is machine-checked.
      - name: Check crate dependency DAG (§10)
        run: cargo xtask check-deps
      - name: Format
        run: cargo fmt --all --check
      - name: Build (minimal shell must compile, zero makepad types)
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  # The `hot-reload` feature's own code and tests, which the default build
  # never compiles, on every desktop host the dev session supports.
  hot-reload:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - name: Clippy (hot-reload)
        run: cargo clippy -p viso --all-targets --features hot-reload -- -D warnings
      - name: Test (hot-reload)
        run: cargo test -p viso --features hot-reload

  # A release artifact carries no dev layer, and a release or shipping build
  # refuses `hot-reload`, on every target. The scan reads symbols from the
  # artifact, so it runs where they stay in it; macOS also launches both host
  # artifacts against a loopback listener. The iOS simulator executable, the
  # Android shared library and the web's wasm module are scanned only.
  release-absence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: ""
            targets: ""
          - os: ubuntu-latest
            args: "--no-launch"
            targets: ""
          - os: macos-latest
            args: "--target ios-sim"
            targets: aarch64-apple-ios-sim
          - os: macos-latest
            args: "--target web"
            targets: wasm32-unknown-unknown
          # The runner's SDK carries an NDK.
          - os: ubuntu-latest
            args: "--target android"
            targets: aarch64-linux-android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Release absence
        run: cargo xtask check-release-absence ${{ matrix.args }}

  # The MCU-ready crates (§50A.6) check for a Cortex-M target with no `std`.
  mcu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: MCU smoke check
        run: cargo xtask mcu-smoke

  # What the dev layer costs the frame loop of a dev build: alternating release
  # runs of the frame-loop bench with and without `hot-reload`, best against
  # best.
  frame-tax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Frame tax
        run: cargo xtask check-frame-tax

  # `viso run ios|android|web-gpu` end to end: boot, install,
  # connect, a `.vs` patch, a Rust warm restart with state restored, Ctrl-C.
  # Each test creates its own simulator or emulator profile and deletes it.
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Simulator session
        run: cargo test -p viso-cli --test device -- --ignored --nocapture ios_simulator

  android-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the emulator and a system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" emulator platform-tools "system-images;android-35;google_apis;x86_64"
      # No display: the emulator boots without a window, on SwiftShader.
      - name: Emulator session
        run: cargo test -p viso-cli --test device -- --ignored --nocapture android_emulator

  web:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --locked --version "$version"
      - name: Browser session
        run: cargo test -p viso-cli --test device -- --ignored --nocapture web
