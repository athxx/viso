[package]
name = "viso-example-persist"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A view whose `@persist` states outlive the app: `Viso.toml` grants
# `storage.persist`, and the facade keeps them in the app's data directory.
[dependencies]
viso = { workspace = true }

# The tests swap the store the facade keeps the values in for one in memory.
[dev-dependencies]
viso-view = { workspace = true }
