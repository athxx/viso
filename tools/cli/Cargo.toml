[package]
name = "viso-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The `viso` command (Viso_CLI.md section 39). Command handlers only orchestrate:
# the project model comes from `viso-project`, the compiler from `viso-dsl`, and
# this crate owns argument parsing, output and exit codes (section 40). The JSON
# event stream is written with `viso-ende`'s writer, the one JSON emitter.
[dependencies]
viso-dsl = { workspace = true }
# The dev channel's wire protocol, shared with the running app.
viso-view = { workspace = true, features = ["hot-reload"] }
viso-ende = { workspace = true }
viso-project = { workspace = true }
# A mature parser rather than a hand-rolled one (section 42): subcommands, global
# options accepted before or after the subcommand, generated help and stable usage
# errors. Color and terminal detection stay off; human output is plain text.
clap = { version = "4.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
] }

# The dev session's project watcher: kqueue (macOS, FreeBSD) and inotify
# (Linux) file events, and `ReadDirectoryChangesW` on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
windows-core = "0.62"

[[bin]]
name = "viso"
path = "src/main.rs"
