[package]
name = "viso-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The `viso` command. Command handlers only orchestrate: the services come from
# `viso-tooling`, the project model from `viso-project`, the compiler from
# `viso-dsl`, and this crate owns argument parsing, output and exit codes. The
# JSON event stream is written with `viso-ende`'s writer, the one JSON emitter.
[dependencies]
# The services it orchestrates: build, the dev session, the inspector
# client, devices and toolchains, delivery and deployment.
viso-tooling = { workspace = true }
viso-dsl = { workspace = true }
# The dev channel's wire protocol and the inspection, profile and scenario
# data a running app reports, which it renders.
viso-dev-protocol = { workspace = true }
# The names of semantic roles an inspection shows.
viso-schema = { workspace = true }
# A snapshot is compared with its golden image.
viso-image = { workspace = true }
viso-ende = { workspace = true }
viso-project = { workspace = true }
# The platforms' SDK, app metadata and ABI types the commands hand the
# services.
viso-package = { workspace = true }
# `viso new --framework` reads the named crate's manifest to tell it is `viso`.
toml_edit = { workspace = true }
# A mature parser rather than a hand-rolled one: subcommands, global options
# accepted before or after the subcommand, generated help and stable usage
# errors. Its own color and terminal detection stay off: `--color` is the CLI's.
clap = { version = "4.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
] }
# The hashes of generated files and of a profile's captures.
sha2 = "0.10"
# Shell completion from the same grammar: `viso completion <shell>` writes a
# script that asks `viso` itself for candidates, so targets, profiles,
# configuration keys and device profile IDs complete as they are now.
clap_complete = { version = "4.6", default-features = false, features = ["unstable-dynamic"] }

# The tests interrupt the `viso` they start as a user would.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bin]]
name = "viso"
path = "src/main.rs"

[lints]
workspace = true
