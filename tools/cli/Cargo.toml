[package]
name = "viso-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The `viso` command. Command handlers only orchestrate: the project model comes
# from `viso-project`, the compiler from `viso-dsl`, and this crate owns argument
# parsing, output and exit codes. The JSON
# event stream is written with `viso-ende`'s writer, the one JSON emitter.
[dependencies]
viso-dsl = { workspace = true }
# The dev channel's wire protocol, shared with the running app.
viso-view = { workspace = true, features = ["hot-reload"] }
# A changed asset is decoded as the app would before it is sent: an image
# through the SVG lane's asset decoder, a font through the text runtime's.
viso-svg = { workspace = true }
viso-text = { workspace = true }
viso-ende = { workspace = true }
viso-project = { workspace = true }
# A dev build for a simulator, an emulator or a browser is packaged as the
# release build is.
viso-package = { workspace = true }
# A mature parser rather than a hand-rolled one: subcommands, global options
# accepted before or after the subcommand, generated help and stable usage
# errors. Its own color and terminal detection stay off: `--color` is the CLI's.
clap = { version = "4.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
] }
# What `viso build` writes: each artifact's SHA-256, and the Brotli and gzip
# copies a web bundle is served precompressed from.
sha2 = "0.10"
brotli = { version = "8", default-features = false, features = ["std"] }
flate2 = "1"
# Shell completion from the same grammar: `viso completion <shell>` writes a
# script that asks `viso` itself for candidates, so targets, profiles,
# configuration keys and device profile IDs complete as they are now.
clap_complete = { version = "4.6", default-features = false, features = ["unstable-dynamic"] }

# The dev session's project watcher: kqueue (macOS, FreeBSD) and inotify
# (Linux) file events, and `ReadDirectoryChangesW` on Windows. A build is
# killed with every process under it: its process group, or a job object on
# Windows; `viso run` catches Ctrl-C to do so.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
windows-core = "0.62"

[[bin]]
name = "viso"
path = "src/main.rs"
