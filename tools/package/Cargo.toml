[package]
name = "viso-package"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The packager: wraps a built app for a target that
# cannot run a bare executable — an iOS `.app`, an Android APK, a web bundle.
# `viso run` packages each dev build with it and `cargo xtask bundle` each
# release build, so there is one packager. It runs the platform toolchains
# (codesign, javac, d8, aapt2, zipalign, apksigner, wasm-bindgen) and depends on
# nothing internal. It writes the archives a package ships in itself, so they
# are the same bytes for the same files on every host.
[dependencies]
flate2 = "1"
sha2 = "0.10"
