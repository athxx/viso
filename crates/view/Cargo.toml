[package]
name = "viso-view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The runtime a compiled view's behavior runs in: a component instance on the
# behavior VM, its states mirrored into the UI state store, and the node event
# handlers that dispatch into it. Only an app whose views carry behavior links
# it; `viso-ui` never depends on it, so a pure Rust app links no VM.
[dependencies]
viso-ui = { workspace = true }
# The view package format, shared with the compiler that emits it.
viso-schema = { workspace = true }
# What the runtime reports to a tool (inspection, profile, headless scenarios)
# and, in a dev artifact, the dev link it speaks.
viso-dev-protocol = { workspace = true }
viso-behavior = { workspace = true, features = ["std"] }
viso-ende = { workspace = true }

[features]
default = ["vm"]
# The behavior interpreter. Without it every chunk a view runs must come
# compiled to Rust (`view!` in any build without it, a package's
# `ViewLoad::native`); a chunk that does not faults `E7105`.
vm = ["viso-behavior/interpreter"]
# The development session that hot-reloads every `view!` mount: reloaded
# bytecode runs on the interpreter.
hot-reload = ["inspect", "vm"]
# Records every `view!` mount, for the development session or a headless run
# to tell which view each node comes from. Off, a mount records nothing.
inspect = ["viso-ui/inspect"]

[lints]
workspace = true
