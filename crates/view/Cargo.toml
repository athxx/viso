[package]
name = "viso-view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The runtime a compiled view's behavior runs in: a component instance on the
# behavior VM, its states mirrored into the UI state store, and the node event
# handlers that dispatch into it. Only an app whose views carry behavior links
# it; `viso-ui` never depends on it, so a pure Rust app links no VM.
[dependencies]
viso-ui = { workspace = true }
viso-behavior = { workspace = true }
viso-ende = { workspace = true }
# A headless snapshot's PNG: written compressed, read in any form.
miniz_oxide = { workspace = true, optional = true }
zune-png = { workspace = true, optional = true }
zune-core = { workspace = true, optional = true }

[features]
# Records every `view!` mount for the development session that hot-reloads it.
# Off, a mount records nothing and no `.vs` source reaches the binary.
hot-reload = []
# Headless snapshots: the PNG a scenario's snapshot step writes and the
# comparison that holds it to its golden.
snapshot = ["dep:miniz_oxide", "dep:zune-png", "dep:zune-core"]
