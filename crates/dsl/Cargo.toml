[package]
name = "viso-dsl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Viso DSL for `.vs` (section 9/Part XIV): tokenizer/CST/AST/HIR, type checker,
# module graph, UI IR, hot-reload diff, state-migration metadata, source map,
# optional dynamic VM adapter.
#
# `dsl -> concrete widget implementation` is forbidden — it works against a
# schema/registry, so it must NOT depend on viso-widgets.
[dependencies]
viso-ui = { workspace = true }
viso-ende = { workspace = true }
# XID_Start/XID_Continue for identifier lexing and NFC for symbol-table entry.
icu_properties = { workspace = true }
icu_normalizer = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.7"

[[bench]]
name = "incremental_reparse"
harness = false
