[package]
name = "viso-dsl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Viso DSL for `.vs` (section 9/Part XIV): tokenizer/CST/AST/HIR, type checker,
# module graph, UI IR, hot-reload diff, state-migration metadata, source map,
# optional dynamic VM adapter.
#
# `dsl -> concrete widget implementation` is forbidden — it works against a
# schema/registry, so it must NOT depend on viso-widgets.
[dependencies]
# What the compiler emits for the runtime: the view and AOT package formats,
# the control, route and region tables, the state and layout vocabulary.
viso-schema = { workspace = true }
# The hot reload patch the compiler plans and the source tables a tool joins
# an inspection with, as the dev link carries them.
viso-dev-protocol = { workspace = true }
viso-ende = { workspace = true }
# The easing curves a page's transitions sample into CSS.
viso-math = { workspace = true, features = ["std"] }
viso-behavior = { workspace = true, features = ["std", "interpreter"] }
# A `shader` declaration lowers into the shader program IR, and a package
# carries its code in the target backend's language, SPIR-V included.
viso-shader = { workspace = true, features = ["spirv"] }
# XID_Start/XID_Continue for identifier lexing and NFC for symbol-table entry.
icu_properties = { workspace = true }
icu_normalizer = { workspace = true }
# Message catalogs: `i18n/<locale>.toml` files, their BCP 47 locale tags and
# the CLDR fallback chain a translation leaves untranslated messages to.
toml_edit = { workspace = true }
icu_locale_core = { workspace = true }
icu_locale_fallback = { workspace = true }

[dev-dependencies]
# The runtime the integration tests mount, reload and drive compiled views in.
viso-ui = { workspace = true }
viso-view = { workspace = true, features = ["hot-reload", "vm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.7"

[[bench]]
name = "incremental_reparse"
harness = false

[[bench]]
name = "behavior_vm"
harness = false

[[bench]]
name = "cpu_shader"
harness = false

[[bench]]
name = "game_world"
harness = false

[[bench]]
name = "game_native"
harness = false

[[bench]]
name = "behavior_native"
harness = false
