[package]
name = "viso-ende"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# LEAF, depends on no other viso-* crate. Viso-owned Encode/Decode
# infrastructure: the binary wire format, a bounded decoder, a minimal JSON
# emitter for diagnostics / tool interchange, and the protocol tag. It is a
# low-level shared facility and is NOT on the frame data-flow main chain.
#
# Dependency-free by design: no serde and no third-party codec. Serde
# compatibility lives in integrations/serde, not here; RON and image/audio/video
# media codecs are out of scope. It must never depend on any framework crate.
[dependencies]

# Benches only: criterion is external, never in this crate's closure, and
# does not build for wasm32. The payloads other crates carry are measured in
# their benches (`viso-dsl`'s `ende_payloads`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.7"

[[bench]]
name = "codec"
harness = false

[features]
default = ["std"]
# `std::io::Error` from a `DecodeError`.
std = []

[lints]
workspace = true
