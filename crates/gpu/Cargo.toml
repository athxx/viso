[package]
name = "viso-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Thin GPU RHI (§17): device, queue, buffer, texture, sampler, pipeline,
# bind group, command encoder, surface, fence. Backend is selected at
# compile time — no per-primitive `dyn GpuBackend` dispatch.
#
# MUST NOT leak widgets/layout/state (§17.1). `gpu -> ui` is forbidden.
[dependencies]
# The shared native-window-handle vocabulary (leaf crate) consumed by
# `GpuBackend::create_surface`. Not a platform dependency — see §10 DAG.
viso-handle = { workspace = true }
# The ABI this crate implements per backend; re-exported whole.
viso-gpu-abi = { workspace = true }
# Typed bitflags for resource-usage descriptors (BufferUsage). External crate,
# not a viso-* edge, so it doesn't affect `xtask check-deps`.
bitflags = "2"
# The `#[derive(GpuInstance)]` proc macro. gpu owns the `GpuInstance` trait +
# layout types, so it re-exports the derive that generates their impls; this is
# the single allowed viso-gpu -> viso-macros edge (§10).
viso-macros = { workspace = true }

# OpenGL ES 3 through EGL (and `libwayland-egl`), loaded at run time; no
# link-time dependency. External crate, not a viso-* edge.
libloading = { version = "0.8", optional = true }


[features]
default = ["native-vulkan"]
# Vulkan as the native backend on Linux and Android; elsewhere its bindings
# compile and nothing links them, and the web has none. A CPU-drawn or GLES
# build leaves it off and has no Vulkan code.
native-vulkan = ["dep:ash"]
# The Vulkan backend on every target: beside the native one where another is
# native (MoltenVK on macOS, the Vulkan runtime on Windows).
vulkan = ["dep:ash"]
# The OpenGL ES 3 backend as this build's backend on Linux and Android, for
# the GPUs whose drivers are GL only (the embedded-gpu profile, ADR 0044).
gles = ["dep:libloading"]
# The software raster as this build's backend on every target: a headless
# build draws to memory, with no device and no window.
headless = []
# The software raster as this build's backend, drawing to the windows the
# platform gives it (a KMS scanout): the embedded-cpu profile (ADR 0044).
cpu = []


# Vulkan bindings (loader resolved at runtime, no link-time dependency), for
# `native-vulkan` and `vulkan`, on every target with a Vulkan loader: the web
# has none, so there the features enable nothing. A build without either
# feature has no Vulkan code.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ash = { version = "0.38", optional = true }

# Windows: the native Direct3D 12 backend (DXGI swapchains, FXC for HLSL).
# External crate, not a viso-* edge.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }

# Web: the WebGPU backend, bound directly to the browser API (no web-sys layer).
# External crates, not viso-* edges.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2.128"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

# Apple targets: the native Metal backend (objc2). External crates, not viso-* edges,
# so they don't affect `xtask check-deps`. The concrete backend is chosen by
# `cfg` (ADR 0029); the headless raster compiles on every target.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
# Objective-C blocks: the command-buffer completion handler that advances the
# frame fence when the GPU finishes a submission.
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSRange"] }
# `CGSize` / `CGFloat` for CAMetalLayer drawable-size and contents-scale. Pulled
# in transitively by objc2-quartz-core; named directly so we can build the types.
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-metal = { version = "0.3", features = [
    "block2",
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLRenderCommandEncoder",
    "MTLDepthStencil",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLLibrary",
    "MTLBuffer",
    "MTLTexture",
    "MTLResource",
    "MTLPixelFormat",
    "MTLDrawable",
    "MTLTypes",
    "MTLAllocation",
    "objc2-io-surface",
] }
# A video frame's IOSurface, sampled in place by a texture over it.
objc2-io-surface = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "objc2-core-foundation",
    "IOSurfaceRef",
] }
objc2-quartz-core = { version = "0.3", features = [
    "CAMetalLayer",
    "CALayer",
    "CATransaction",
    "objc2-metal",
] }

[dev-dependencies]
# Compile-fail tests proving `#[derive(GpuInstance)]` rejects unsupported field
# types and non-`#[repr(C)]` structs. External crate; not a viso-* edge.
trybuild = "1"

# Dma-bufs allocated from a heap and written on the CPU, imported.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

# IOSurfaces written on the CPU, imported as textures.
[target.'cfg(target_vendor = "apple")'.dev-dependencies]
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-io-surface = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "objc2-core-foundation",
    "libc",
    "IOSurfaceRef",
    "IOSurfaceTypes",
] }

[lints]
workspace = true
