[package]
name = "viso-widgets"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Official UI kit (§9 viso-widgets): primitive controls, layout containers,
# navigation, overlays, adaptive UI, desktop shell, theme defaults.
# PDF/browser/chart/map are NOT base widgets — they belong in optional
# integrations, not here.
[dependencies]
viso-ui = { workspace = true }

# Widget microbenches drive build/layout/paint_tree through viso-ui only, so no
# facade or render dev-dep is needed and no dependency edge is added.
[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "view_build"
harness = false
