[package]
name = "viso-text"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Text/Font runtime: font manifest/resolve/format, fallback, shaping,
# UAX-9/14/29 world-ready paragraph correctness, adaptive glyph representation
# (coverage/MTSDF/vector/color) plus residency metadata. Rebuilt module set and
# implementation order follow Viso_Text_Font_Runtime.md; the GPU texture/page
# machinery stays in viso-render.
[dependencies]
# Exact A8 coverage, rasterized or read from baked pages: one crate, so the
# pages `packaged_fonts!` bakes are the pixels this crate would rasterize.
viso-glyph-a8 = { workspace = true, features = ["raster"] }
ttf-parser = { workspace = true }
rustybuzz = { workspace = true }
ab_glyph_rasterizer = { workspace = true }
unicode-bidi = { workspace = true }
unicode-script = { workspace = true }
unicode-segmentation = { workspace = true }
icu_segmenter = { workspace = true }
icu_properties = { workspace = true }
icu_locale_core = { workspace = true }
zune-png = { workspace = true }
zune-core = { workspace = true }

[features]
default = ["complex-line-break"]
# Line breaking inside Thai, Lao, Khmer and Myanmar runs, which have no spaces
# between words: ICU4X's LSTM models for the four scripts, the largest Unicode
# data the text runtime carries. Off, those runs break only where UAX #14 lets
# any text break (spaces, punctuation) and a run wider than the line falls back
# to grapheme breaks. A build turns it off when no locale it declares, and no
# text it ships, is written in one of the four scripts (§3.5).
complex-line-break = ["icu_segmenter/auto"]
# Records fallback walks, cache misses and evictions for the Inspector
# (`inspect`). Off, every record site compiles out.
inspector = []

# Benches only. criterion is a dev-dependency: it never ships in the text
# runtime and is not an architecture DAG edge (external crate, ignored by
# `xtask check-deps`).
# Native measurements: criterion does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.7"

[[bench]]
name = "high_refresh"
harness = false

[[bench]]
name = "incremental_edit"
harness = false

[lints]
workspace = true
