[package]
name = "viso-text"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Text system (§13/Part XIII): font DB, fallback, shaping, BiDi, line
# breaking, paragraph layout, glyph cache/atlas integration metadata.
[dependencies]
viso-gpu = { workspace = true }
ttf-parser = { workspace = true }
rustybuzz = { workspace = true }
ab_glyph_rasterizer = { workspace = true }
sdfer = { workspace = true }
unicode-bidi = { workspace = true }
unicode-script = { workspace = true }
unicode-segmentation = { workspace = true }
zune-png = { workspace = true }
zune-core = { workspace = true }

# Benches only. criterion is a dev-dependency: it never ships in the text crate
# and is not an architecture DAG edge (external crate, ignored by dep checks).
[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "wrap_line"
harness = false

[[bench]]
name = "paragraph_cache"
harness = false
