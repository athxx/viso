[package]
name = "viso-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The core app services: opening URLs and haptic feedback, plus the app's
# data directory. Cold paths, so trait objects are fine here; this OS logic
# stays out of platform/runtime. Each OS's bindings sit behind its target
# cfg. Everything else (file dialogs, notifications, secure storage, share)
# lives in its own viso-ext crate.
[dependencies]

# macOS and iOS: NSWorkspace / UIApplication, and the feedback generators.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2-ui-kit = { version = "0.3", features = ["block2"] }

# Windows: `ShellExecute`.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux and the BSDs (`desktop`): the desktop portal's OpenURI, on the
# session bus.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io"] }

# Android: JNI into the `dev.viso.services` Java class the app's APK
# carries, reached through the activity the platform backend holds.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4"
viso-platform = { workspace = true }

# Web: `window.open`, `navigator.vibrate`, and `localStorage` for app
# data.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "DomException",
    "Navigator",
    "Storage",
    "Window",
] }

[features]
default = ["desktop"]
# Linux and the BSDs: the desktop portal on the session bus opens URLs.
# Off (an embedded build, which has no session bus), opening a URL reports
# unsupported. No effect elsewhere.
desktop = ["dep:zbus"]
