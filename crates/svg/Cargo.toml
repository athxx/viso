[package]
name = "viso-svg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# SVG input lane (§13): SVG bytes → parse → normalized vector document. SVG is
# an input format, not a per-frame XML DOM renderer; parsing is a cold,
# cacheable step implemented here on std alone (no third-party dependencies).
# The renderer lowers the document (`viso_render::svg`); tooling checks an
# asset with this crate alone.
[dependencies]
viso-math = { workspace = true, features = ["std"] }
# A data URL's base64 payload.
viso-ende = { workspace = true }

[lints]
workspace = true
