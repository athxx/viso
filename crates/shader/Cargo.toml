[package]
name = "viso-shader"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Shader compiler (§19): source -> parsed syntax -> typed IR -> validation ->
# backend codegen. May share diagnostic/source infrastructure with the DSL
# but does NOT share a runtime VM with it.
[dependencies]
# Errors in shader text, in the shape the `.vs` frontend reports in.
viso-diag = { workspace = true }
# The GPU ABI a program is laid out and coded for; no backend.
viso-gpu-abi = { workspace = true }
# The codec a view package carries a brush's layout and code in.
viso-ende = { workspace = true }
# The reference WGSL front end and SPIR-V writer: a program's Vulkan code.
# Only the tools that generate a program's code at build time and in the dev
# host enable it; no runtime crate links it.
naga = { version = "30", features = ["wgsl-in", "spv-out"], optional = true }

[features]
spirv = ["dep:naga"]

[dev-dependencies]
# The reference WGSL front end + validator and SPIR-V writer: checks every
# emitted WGSL module and produces the frozen SPIR-V artifacts the Vulkan
# backend embeds. Test-only; never linked into a build.
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

[lints]
workspace = true
