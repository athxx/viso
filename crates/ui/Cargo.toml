[package]
name = "viso-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# UI runtime (§9/§14-16): NodeArena, component runtime, state slots, reactive
# invalidation, layout, style, input/focus/gesture, semantics, animation,
# paint-node bridge. Retained tree + generational IDs, NOT Rc<RefCell<dyn
# Widget>>. `ui -> widgets` is forbidden.
[dependencies]
viso-render = { workspace = true }
viso-runtime = { workspace = true }

# Benches only. criterion is a dev-dependency: it never ships in the ui crate and
# is not an architecture DAG edge (external crate, ignored by `xtask check-deps`).
[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "large_list"
harness = false

[[bench]]
name = "grid_layout"
harness = false
