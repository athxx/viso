[package]
name = "viso-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# UI runtime (§9/§14-16): NodeArena, component runtime, state slots, reactive
# invalidation, layout, style, input/focus/gesture, semantics, animation,
# paint-node bridge. Retained tree + generational IDs, NOT Rc<RefCell<dyn
# Widget>>. `ui -> widgets` is forbidden.
[dependencies]
viso-render = { workspace = true }
viso-runtime = { workspace = true }
# AOT package codec (Slice P, architecture section 41): the release loader decodes a
# compact serialized UI package and instantiates it through `BuildCx`, so the release
# path carries no DSL compiler. `viso-ende` is a dependency-free DAG leaf.
viso-ende = { workspace = true }
# Editing reads the text runtime's position, caret, hit-test, selection and IME
# model (spec 12.2, 12.13-12.17) instead of keeping a second byte-offset one.
viso-text = { workspace = true }

# Benches only. criterion is a dev-dependency: it never ships in the ui crate.
# Native measurements: criterion does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.7"

