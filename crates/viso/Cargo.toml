[package]
name = "viso"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust-native, GPU-first, cross-platform application framework."

# The single public facade (AGENTS §3.1). Normal apps depend only on `viso`.
# It implements essentially no hot-path logic; it aggregates features,
# curates the prelude, and re-exports advanced modules.
[dependencies]
viso-runtime = { workspace = true }
viso-ui = { workspace = true }
viso-ui-macros = { workspace = true }
# The handler host the DSL macros' expansions dispatch into (`::viso_view::…`).
viso-view = { workspace = true }
# A game's audio systems on the device (`viso::audio`).
viso-behavior = { workspace = true }
viso-widgets = { workspace = true }
# The compiler the in-app development session recompiles `.vs` edits with;
# only a dev artifact (`hot-reload`) links it, so a release app never does.
viso-dsl = { workspace = true, optional = true }
viso-services = { workspace = true }
viso-render = { workspace = true }
viso-svg = { workspace = true }
viso-gpu = { workspace = true }
viso-platform = { workspace = true }
viso-text = { workspace = true }
viso-shader = { workspace = true }
viso-macros = { workspace = true }

# CoreText system-font provider (crates/viso/src/system_fonts/coretext.rs),
# shared by macOS and iOS. objc2-core-* returns CFRetained<T> RAII wrappers, so
# the provider drops CoreFoundation objects without manual CFRelease.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-core-text = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }

# Windows system-font provider: DirectWrite's system collection and fallback.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
] }
# `#[implement]` (the fallback's text source) expands to `windows_core` paths.
windows-core = "0.62"

# Linux / BSD and Android system-font providers load `libfontconfig` /
# `libandroid` at runtime through `dlopen`.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios"))))'.dependencies]
libc = "0.2"

# The hot reload watcher's kqueue (macOS, iOS, FreeBSD) and inotify (Linux,
# Android) file events.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# Kept small and stable on purpose — no giant feature cartesian product
# (§5). Backends resolve from the target, not from user feature combos.
mobile = []
# The development session: every `view!` mount is recorded, its `.vs` file
# watched and each edit committed as one hot reload transaction.
hot-reload = [
    "viso-view/hot-reload",
    "dep:viso-dsl",
    # The watcher's `ReadDirectoryChangesW` file events on Windows.
    "windows/Win32_Security",
    "windows/Win32_Storage_FileSystem",
    "windows/Win32_System_IO",
    "windows/Win32_System_Threading",
]
# Text runtime explanations — every fallback walk, cache miss and eviction —
# for the Inspector; compiled out otherwise.
inspector = ["viso-text/inspector"]
# The Vulkan backend where another is native (MoltenVK on macOS): the second
# GPU backend the shader cross-backend tests draw on.
vulkan = ["viso-gpu/vulkan"]

[dev-dependencies]
# The DSL tests compile `.vs` sources themselves, with or without `hot-reload`.
viso-dsl = { workspace = true }
# The CoreText provider's sfnt-reassembly tests parse their output to prove the
# reassembled directory is valid, and the system-font smoke tests shape through
# the resolved face. Only used in tests, so they stay dev-dependencies.
ttf-parser = { workspace = true }
rustybuzz = { workspace = true }
# The DSL macros' diagnostics are checked against the spans rustc reports.
trybuild = "1"
# The reference WGSL front end + validator: checks the WGSL shader programs
# lower to, reflects their uniform and instance layouts, and writes the SPIR-V
# the Vulkan backend draws them from.
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

# Web: the WebGPU device opens asynchronously before the scheduler starts.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = "0.4"

# Native measurements: criterion does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.7"

# Multi-window microbenchmarks: window open/close cost and the per-frame
# `run_phase` fan-out over N windows (validating the linear `Vec<WindowState>`).
[[bench]]
name = "window_frame"
harness = false

# The wired text runtime under the §26 matrix and the per-tier commit budgets.
[[bench]]
name = "text_runtime"
harness = false
