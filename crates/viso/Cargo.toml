[package]
name = "viso"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust-native, GPU-first, cross-platform application framework."

# The single public facade (AGENTS §3.1). Normal apps depend only on `viso`.
# It implements essentially no hot-path logic; it aggregates features,
# curates the prelude, and re-exports advanced modules.
[dependencies]
viso-runtime = { workspace = true }
viso-math = { workspace = true, features = ["std"] }
viso-ui = { workspace = true }
viso-ui-macros = { workspace = true }
# The handler host the DSL macros' expansions dispatch into (`::viso_view::…`).
viso-view = { workspace = true }
# A game's audio systems on the device (`viso::audio`).
viso-behavior = { workspace = true, features = ["std"] }
# The aligned `static` the macros embed a module's and a view's bytes in.
viso-ende = { workspace = true }
viso-widgets = { workspace = true }
# The view planner the development session turns the host's accepted `.vs`
# sources into commits with; only a dev artifact (`hot-reload`) links it, so a
# release app never does.
viso-services = { workspace = true }
viso-render = { workspace = true }
# A headless snapshot step captures and writes its image.
viso-image = { workspace = true }
viso-gpu = { workspace = true }
viso-platform = { workspace = true }
viso-text = { workspace = true }
viso-shader = { workspace = true }
viso-macros = { workspace = true }

# CoreText system-font provider (crates/viso/src/system_fonts/coretext.rs),
# shared by macOS and iOS. objc2-core-* returns CFRetained<T> RAII wrappers, so
# the provider drops CoreFoundation objects without manual CFRelease.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-core-text = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }

# Windows system-font provider: DirectWrite's system collection and fallback.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
] }
# `#[implement]` (the fallback's text source) expands to `windows_core` paths.
windows-core = "0.62"

# Linux / BSD and Android system-font providers load `libfontconfig` /
# `libandroid` at runtime through `dlopen`.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios"))))'.dependencies]
libc = "0.2"

[features]
default = ["vm", "desktop", "native-vulkan", "rasterizer", "complex-line-break"]
# Kept small and stable on purpose — no giant feature cartesian product
# (§5). Backends resolve from the target, not from user feature combos.
# The desktop display backends on Linux and the BSDs (Wayland and X11, with
# the desktop portal and AT-SPI) and the session-bus services (file chooser,
# notifications, Secret Service); no effect elsewhere. An embedded build turns
# defaults off and keeps `kms` alone.
desktop = ["viso-platform/x11", "viso-platform/wayland", "viso-services/desktop"]
# Vulkan as the native backend on Linux and Android; no effect elsewhere. An
# embedded-cpu build, and an embedded-gpu one on GLES, leaves it off and links
# no Vulkan bindings.
native-vulkan = ["viso-gpu/native-vulkan"]
mobile = []
# The behavior interpreter a debug build runs `view!` behavior on. Off, every
# view runs the Rust its behavior compiles to, in every build, and no
# interpreter links.
vm = ["viso-view/vm"]
# The development session: every `view!` mount is recorded and reported to
# `viso run`, and each edit the host accepts commits as one hot reload
# transaction.
hot-reload = [
    "vm",
    "viso-view/hot-reload",
    "viso-ui/hot-reload",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
]
# Text runtime explanations — every fallback walk, cache miss and eviction —
# for the Inspector; compiled out otherwise.
inspector = ["viso-text/inspector"]
# The Vulkan backend where another is native (MoltenVK on macOS): the second
# GPU backend the shader cross-backend tests draw on.
vulkan = ["viso-gpu/vulkan"]
# The headless build `viso build headless` and `viso test` make: no window and
# no device; every window draws through the software raster at a fixed
# surface, frames step a fixed clock, text resolves through the app's own
# fonts only and shapes on the frame that asks for it.
headless = ["viso-gpu/headless", "viso-view/inspect"]
# OpenGL ES 3 as the backend on Linux and Android (the embedded-gpu profile).
gles = ["viso-gpu/gles"]
# The embedded Linux display backend: the card driven through DRM/KMS where no
# Wayland or X11 session runs (the embedded profiles).
kms = ["viso-platform/kms"]
# The software raster as the backend, drawing to the display (the
# embedded-cpu profile).
cpu = ["viso-gpu/cpu"]
# Desktop emulation of an embedded-cpu build (macOS): with `cpu`, the window
# takes the configured panel's size, pixel format and scale, each panel pixel
# a square of screen pixels; the profile's budgets, workers and fonts apply as
# they do on the device.
emulate = ["viso-platform/emulate"]
# The platform's fonts as fallbacks in an embedded profile, which otherwise
# draws with the app's packaged fonts alone.
system-fonts = []
# Glyphs rasterized from their outlines at run time, and color glyphs painted
# from a face's color tables. Off, every glyph draws from the pages
# `packaged_fonts!` baked at build time for the sizes the target declares, and
# no font rasterizer links: `packaged_fonts!` refuses a build whose packaged
# faces are not all baked (Text/Font Runtime §3.6). An embedded target keeps it
# unless its `fonts.rasterizer` is `false`.
rasterizer = []
# Line breaking between the words of Thai, Lao, Khmer and Myanmar text (the
# LSTM models of `viso-text/complex-line-break`). An embedded target keeps it
# only when a locale it declares, or text it ships, is written in one of them
# (Text/Font Runtime §3.5).
complex-line-break = ["viso-text/complex-line-break"]

[dev-dependencies]
# The DSL tests compile `.vs` sources themselves, with or without `hot-reload`,
# and reload them in process with the patch the dev link carries.
viso-dsl = { workspace = true }
viso-dev-protocol = { workspace = true }
# The shader goldens draw a program on Vulkan from the SPIR-V its code writes.
viso-shader = { workspace = true, features = ["spirv"] }
# The CoreText provider's sfnt-reassembly tests parse their output to prove the
# reassembled directory is valid, and the system-font smoke tests shape through
# the resolved face. Only used in tests, so they stay dev-dependencies.
ttf-parser = { workspace = true }
rustybuzz = { workspace = true }
# The DSL macros' diagnostics are checked against the spans rustc reports.
trybuild = "1"
# The reference WGSL front end + validator: checks the WGSL shader programs
# lower to, reflects their uniform and instance layouts, and writes the SPIR-V
# the Vulkan backend draws them from.
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

# Web: the WebGPU device opens asynchronously before the scheduler starts.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = "0.4"
# A dev build in a browser reaches `viso run` over a WebSocket.
wasm-bindgen = { version = "0.2.128", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "BinaryType",
    "CloseEvent",
    "Location",
    "MessageEvent",
    "WebSocket",
    "Window",
    "console",
] }

# Native measurements: criterion does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.7"

# Multi-window microbenchmarks: window open/close cost and the per-frame
# `run_phase` fan-out over N windows (validating the linear `Vec<WindowState>`).
[[bench]]
name = "window_frame"
harness = false

# The frame loop of a mounted `view!`, run with and without `hot-reload`: the
# two differ only by the dev path (hot reload §1.2).
[[bench]]
name = "frame_loop"
harness = false

# The wired text runtime under the §26 matrix and the per-tier commit budgets.
[[bench]]
name = "text_runtime"
harness = false

# One scroll frame of a 100k-row list: transform roots move, nothing repaints
# (§21), at two visible row counts.
[[bench]]
name = "list_scroll"
harness = false
