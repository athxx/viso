[package]
name = "viso-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# BOTTOM OF DAG. viso-platform is a pure OS abstraction: window/surface,
# raw pointer/keyboard/IME events, clipboard, cursor, system appearance,
# lifecycle, native handles, accessibility bridge hook.
#
# FORBIDDEN dependencies (architecture §10.1): ui, widgets, dsl, studio.
# This MUST NOT pull in script, network, video, or live-reload.
#
# Native backends are the only external deps, each behind a target cfg so
# headless/CI on a non-matching target pulls zero external crates. These are
# published, memory-safe bindings — Viso owns the window/event/loop
# *semantics*, not the FFI scaffolding.
[features]
default = ["x11", "wayland"]
# Linux and the BSDs: the X11 backend, with the desktop portal and AT-SPI.
x11 = [
    "dep:x11rb",
    "dep:xim",
    "xkbcommon-dl/x11",
    "dep:zbus",
    "dep:accesskit",
    "dep:accesskit_unix",
]
# Linux and the BSDs: the Wayland backend, with the desktop portal and AT-SPI.
wayland = [
    "dep:wayland-client",
    "dep:wayland-backend",
    "dep:wayland-protocols",
    "dep:wayland-cursor",
    "dep:zbus",
    "dep:accesskit",
    "dep:accesskit_unix",
]
# macOS: a CPU-drawn window stands in for the embedded panel the build is
# configured for (`VISO_KMS_MODE`, `VISO_KMS_FORMAT`, `VISO_KMS_ROTATION`,
# `VISO_SCALE`): its size, pixel format and scale, each panel pixel a square of
# screen pixels. No effect elsewhere.
emulate = []
# The embedded Linux backend: the card driven through DRM/KMS with no display
# server, evdev input and uevent hotplug (libgbm and libseat loaded at run
# time when present). Picked when no Wayland or X11 session is advertised.
kms = []

[dependencies]
# The shared native-window-handle vocabulary (leaf crate). Produced here by
# `Window::raw_handle`, consumed by viso-gpu — kept in its own crate so gpu
# needn't depend on platform (§10 DAG).
viso-handle = { workspace = true }

# The tree vocabulary of the AccessKit adapters (ADR 0030, ADR 0042): data
# types only, which the bridge converts each `SemanticsDelta` to on the
# targets whose adapter is AccessKit's; each adapter crate sits with its
# backend below (on Linux, with the desktop backends). iOS and the Web run
# Viso's own adapters and link none of it.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "android"))'.dependencies]
accesskit = "0.25"

# macOS: AppKit via objc2.
[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.27"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSDate",
    "NSString",
    "NSArray",
    "NSAttributedString",
    "NSRunLoop",
    "NSObjCRuntime",
    "NSNotification",
    "NSGeometry",
    "NSRange",
    "NSValue",
    "NSThread",
    "NSLocale",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSEvent",
    "NSGraphicsContext",
    "NSRunningApplication",
    "NSTrackingArea",
    "NSText",
    "NSTextInputClient",
    "NSTextInputContext",
    "NSAttributedString",
    "NSPasteboard",
    "NSCursor",
    "NSAppearance",
    "NSWorkspace",
    "NSAccessibility",
    "NSScreen",
] }

# iOS / iPadOS: UIKit via objc2 (default features: every class the backend
# names is in the default set).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"

# Android: JNI into the `dev.viso` Java shell, NDK entry points by hand.
[target.'cfg(target_os = "android")'.dependencies]
accesskit_android = { version = "0.8", features = ["embedded-dex"] }
jni-sys = "0.4"
libc = "0.2"

# Web: the page clock (`performance.now`) behind `time::Instant`, and the DOM
# bindings the web backend drives.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "Clipboard",
    "ClipboardEvent",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DomRectReadOnly",
    "Element",
    "Event",
    "EventTarget",
    "FocusOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "InputEvent",
    "KeyboardEvent",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "Node",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverOptions",
    "ResizeObserverSize",
    "UiEvent",
    "VisualViewport",
    "WheelEvent",
    "Window",
    "console",
] }

# Windows: Win32 via the windows crate.
[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "0.35"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_Ime",
    "Win32_UI_Accessibility",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Globalization",
    # Audio output: WASAPI over COM.
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Security",
] }

# Linux and the BSDs: X11 through XCB (libxcb loaded at runtime, `x11`),
# Wayland through libwayland-client (also loaded at runtime, `wayland`),
# xkbcommon for keymaps and compose on every backend, and with a desktop
# backend the desktop portal over D-Bus for appearance and AT-SPI over the
# accessibility bus. A KMS-only build links none of the desktop stack.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
x11rb = { version = "0.13", optional = true, features = [
    "allow-unsafe-code",
    "dl-libxcb",
    "cursor",
    "randr",
    "render",
    "resource_manager",
    "xinput",
    "xkb",
] }
xim = { version = "0.5", optional = true, default-features = false, features = ["x11rb-client", "x11rb-xcb"] }
xkbcommon-dl = "0.4"
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", optional = true, features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", optional = true, features = ["client", "staging", "unstable"] }
wayland-cursor = { version = "0.31", optional = true }
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io"] }
accesskit = { version = "0.25", optional = true }
accesskit_unix = { version = "0.23", optional = true }
libc = "0.2"
