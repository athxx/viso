[package]
name = "viso-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Media through the OS: video played by each platform's own player, which
# decodes in hardware, keeps sound and picture in step and drives the audio
# device itself. Its own crate because each target links a different media
# stack (AVFoundation, Media Foundation, GStreamer, the NDK's media, the
# browser's), none of which the window/input layer needs.
#
# It depends on nothing of the framework but the handle vocabulary, which
# names a frame a GPU samples in place.
[dependencies]
viso-handle = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFString",
    "CFDictionary",
    "CFCGTypes",
    "objc2",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CMTime",
    "CMTimeRange",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
    "CVBase",
    "CVPixelBufferIOSurface",
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "objc2-core-foundation",
    "IOSurfaceRef",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-media",
    "objc2-core-video",
    "objc2-core-foundation",
    "AVAsset",
    "AVAssetTrack",
    "AVMediaFormat",
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerItemOutput",
    "AVPlayerItemTrack",
] }

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDate",
    "NSRunLoop",
] }

# MediaPlayer through JNI, its pictures through the NDK's image reader.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4"

# The browser's `<video>`, bound directly to the browser API.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2.128"
js-sys = "0.3"

# GStreamer, opened at run time.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[[test]]
name = "player"
harness = false
