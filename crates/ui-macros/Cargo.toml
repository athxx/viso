[package]
name = "viso-ui-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The Rust-side Viso DSL entry points `ui!`, `component!` and `view!` (AGENTS
# §21.5). A proc-macro crate is a compile-time dylib, so it MAY carry an ordinary
# library dependency: it runs the shared `viso-dsl` frontend at Rust compile time
# and emits static `viso_ui` builder code. No runtime parse, no VDOM (§59), no
# macro-only DSL semantics (§21.5).
#
# The emitted tokens name `viso_ui::…` paths; this crate does not depend on viso-ui.
# The facade `viso` re-exports the macros and depends on viso-ui, so the emitted
# paths resolve at the call site.
[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
toml_edit = "0.25"
viso-dsl = { workspace = true }
