[package]
name = "viso-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Renderer (§16): paint primitive, retained paint cache, clip/layer, batch
# builder, image/glyph atlas management, render graph, GPU upload plan,
# frame packet. Decides batching/atlas/clip/passes; UI never owns backend
# command submission (§16.1). `render -> widgets` is forbidden.
[dependencies]
viso-math = { workspace = true }
viso-text = { workspace = true }
viso-shader = { workspace = true }
viso-gpu = { workspace = true }

# Analytic path coverage for clip/mask R8 rasterization (§14.4). External crate,
# already transitive via viso-text; not an internal DAG edge (`xtask check-deps`
# gates only viso-internal edges).
ab_glyph_rasterizer = { workspace = true }

# Benches only. criterion is a dev-dependency: it never ships in the renderer and
# is not an architecture DAG edge (external crate, ignored by `xtask check-deps`).
[features]
# Build the Vulkan backend on targets where it is not the native one (MoltenVK on
# macOS), so its device tests run there.
vulkan = ["viso-gpu/vulkan"]

# The steady-state benches are native measurements; criterion does not build for
# wasm32 (the web path is verified by the WebGPU tests instead).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.7"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "renderer_steady_state"
harness = false
